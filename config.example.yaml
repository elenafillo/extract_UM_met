# extract_um_met configuration TEMPLATE.
#
#   cp config.example.yaml config.yaml
#
# then edit config.yaml (which is git-ignored) with your personal details. The
# shared structure below — domains, data_types, grid specs — is the part worth
# versioning; the only truly personal field is `met_extract_author`.

# Set personal details
user: ""                            # Leave blank; filled from the $USER environment variable
met_extract_author: ""              # Your name / ID, recorded in output provenance

# Directory where to process and save world regions (scratch)
scratch_path: "/work/scratch-pw5/{user}/"

# Directory where yearly zarr stores are saved
zarr_save_directory: "/gws/ssde/j25b/acrg/{user}/satellite_met_zarr/"

# Zarr format version (2 for backward compatibility with zarr 2.18.7, or 3 for newer zarr)
zarr_format: 2

# Shared directory holding the reference footprint for each domain
reference_footprints_directory: "/gws/ssde/j25b/acrg/elenafi/example_footprints"

# Directory where saved native UM grids are stored
native_grid_directory: "data/"

# CF-convention metadata written into the output zarr stores. Fill in what
# applies to your group; leave any field as "" to omit it (empty fields are not
# written as blank attributes).
metadata:
  conventions: "CF-1.10"     # CF conventions version claimed by the output
  institution: "University of Bristol, Atmospheric Chemistry Research Group"
  references: ""             # e.g. a DOI or URL documenting the dataset or method
  title: ""                  # optional; auto-generated per domain/year if left empty
  source: ""                 # optional; auto-generated from the UM Mk version if left empty
  comment: ""                # optional; appended to the auto-generated processing comment

# Per-data-type overrides (paths and tuning). The structural properties of each
# data type — grid type, region scheme, tiled/not, level count, cadence — are
# defined in extract_um_met/sources.py; here you set environment-specific paths and,
# optionally, which variables to extract.
#
# Variable groups (all optional; defaults live in extract_um_met/sources.py):
#   mass_vars               instantaneous mass-grid fields — [cube_name, has_levels]
#   wind_vars               staggered winds u/v            — [cube_name, has_levels]
#   averaged_mass_vars      time-mean mass-grid fields     — [cube_name, ...]
#   averaged_staggered_vars time-mean staggered fields     — [cube_name, ...]
# Names must match the archive's iris cube names exactly; has_levels must say
# whether the cube carries model levels (a mismatch fails loudly at extraction).
# Set any group to [] to drop it. Editing these here changes every run using this
# config, so keep a job-specific config (or a --suffix) for variant extractions.
#
# Model levels: by default `level_stride` keeps level 1 plus every Nth level.
# Give an explicit `model_levels` list (1-based, ≤ the source's n_levels) to load
# exactly those levels instead — it overrides level_stride. `model_levels: "all"`
# loads every level the source has (59 for UM_Global, 70 for NZCSM)
data_types:
  UM_Global:
    # Global UM archive (Mk6–12).
    archive_directory: "/gws/ssde/j25a/name/met_archive/Global/"
    # Example: extract only temperature + humidity + winds, no averaged fields.
    # mass_vars:
    #   - [air_temperature, true]
    #   - [specific_humidity, true]
    #   - [surface_air_pressure, false]
    # wind_vars:
    #   - [x_wind, true]
    #   - [y_wind, true]
    # averaged_mass_vars: []
    # averaged_staggered_vars: []
    # Level selection — pick ONE of these:
    # level_stride: 3               # level 1 + every 3rd level (the default)
    # model_levels: [1, 10, 20, 30, 40, 50, 59]   # exact levels (overrides stride)
    # model_levels: "all"           # every level the source has
  UM1p5km:
    # 1.5 km UK LimitedArea archive (Mk2–4). Region tiles live under
    # UM1p5km_Mk{mk}PT/PT{region}/ inside this directory.
    archive_directory: "/gws/ssde/j25a/name/met_archive/LimitedArea/"
  NZCSM:
    # New Zealand convective-scale model archive (single file per timestep).
    archive_directory: ""    # TODO: set once the NZCSM archive exists

# Static ancillary fields (`extract-topog`), keyed by data type. These are
# extracted once per domain-year, onto the same target grid as the met, and
# written to {ancillary_save_directory}/{domain}/{domain}_topog_{year}.nc
#
# The UM Global orography changes between Mk blocks — five distinct fields cover
# Mk6-Mk11, and two blocks sharing a grid does NOT mean they share a field, so
# each Mk names its own ancillary directory. Sources with one field for all time
# (NZCSM) use `native_topog_file` instead. See How_Tos/orography.md.
ancillary_types:
  UM_Global:
    native_topog_directory: "/gws/ssde/j25a/name/data/UMAncils/Global"
    topog_by_mk:
      6:  UMG_Mk7_ps33     # Mk6 and Mk7 genuinely share one field
      7:  UMG_Mk7_ps33
      8:  UMG_Mk8_ps35
      9:  UMG_Mk9_ps38
      10: UMG_Mk10_ps41
      11: UMG_Mk11_ps45
      12: UMG_Mk11_ps45    # no Mk12 ancillary published yet; known approximation
  NZCSM:
    native_topog_file: ""    # TODO: set once the NZCSM topography file is placed

# Where extract-topog writes its output. Defaults to zarr_save_directory, so the
# orography lands beside the yearly met store it belongs with.
# ancillary_save_directory: "/gws/ssde/j25b/acrg/{user}/satellite_met_zarr/"

# Default edge size for latitude and longitude if not specified per domain
default_edge_size: [100, 100]

# Each domain may set `output_chunks` to control the on-disk chunk shape of its
# yearly zarr store, keyed by time/levels/lat/lon (-1 = one chunk over the whole
# dim). Only the dims you name change; the rest keep the default
# {time: 1, levels: 3, lat: -1, lon: -1}, which suits scattered single-timestep
# reads. Raise `time` if you mostly read long time series at a few points.
#
# `intermediate_period` sets how much time one scratch intermediate covers:
# month (the default), week (7-day blocks within the month: 1-7, 8-14, 15-21,
# 22-28, 29-end), or day. Extraction holds one period of one region in memory at
# once, so this is the knob to turn when a large domain runs out of memory —
# weekly needs roughly a quarter of monthly, daily a thirtieth. The cost is more
# (smaller) scratch stores and more appends to the yearly store; the output is
# identical either way. Big domains, many model levels, and fine target grids all
# push in the same direction.
domains:
  # Whole-globe orography at the UM's own resolution: no target grid, no
  # interpolation, no world regions. `extract-topog` only — the met pipeline has
  # no use for a global domain, and `run`/`extract` reject grid mode 'global'.
  # One file per year serves every native-mode consumer, which subsets its own
  # box out of it; footprint/regular domains still need their own file, because
  # their target grid is an interpolated mesh off the UM native ladder.
  GLOBAL:
    domain_name: "GLOBAL"
    data_type: "UM_Global"
    grid:
      mode: global

  SA:
    domain_name: "SOUTHAMERICA"
    footprint: "GOSAT-BRAZIL-column_SOUTHAMERICA_201801.nc"
    world_regions_codes: [6, 9, 10, 13]
    # intermediate_period: week    # month (default) | week | day
    # output_chunks:
    #   time: 24                   # only the dims you name are changed
    # Grid specification (optional; if absent, falls back to footprint mode with default edge sizes)
    grid:
      mode: footprint              # footprint (default) | regular | native
      edge_size_lat: [100, 100]
      edge_size_lon: [85, 100]
    # Example grid specifications for other modes:
    # For regular mode:
    #   mode: regular
    #   lat_bounds: [-25, 15]
    #   lon_bounds: [-75, -30]
    #   dlat: 0.234
    #   dlon: 0.352
    # For native mode:
    #   mode: native
    #   lat_bounds: [-25, 15]
    #   lon_bounds: [-75, -30]
    #   native_grid: majority  # or "latest", "Mk10", etc.

  NA:
    domain_name: "NORTHAFRICA"
    footprint: "GOSAT-SAHARA-column_NORTHAFRICA_201611.nc"
    world_regions_codes: [2, 3, 6, 7]
    edge_size_lat: [100, 100]
    edge_size_lon: [85, 100]

  CHINA:
    domain_name: "CHINA"
    footprint: "GOSAT-CHINA-column_EASTASIA_201605.nc"
    world_regions_codes: [3, 4, 7, 8]

  INDIA:
    domain_name: "INDIA"
    footprint: "GOSAT-INDIA-SAM-column_SOUTHASIA_201503.nc"
    world_regions_codes: [3, 7]

  # To extract an existing domain on a different grid, don't define a second
  # domain here — run it with `--grid-mode native --suffix native` so the variant
  # lands beside the main store with its own resume state.

  # New Zealand convective-scale model — a non-tiled, rotated-pole source. It has
  # no world_regions_codes (one file covers the whole domain). The target is a
  # regular lat/lon grid; longitudes are in 0–360 because the domain crosses 180°.
  NZ:
    domain_name: "NEWZEALAND"
    data_type: "NZCSM"
    grid:
      mode: regular
      lat_bounds: [-49.0, -30.2]
      lon_bounds: [160.5, 184.8]
      dlat: 0.02
      dlon: 0.02
